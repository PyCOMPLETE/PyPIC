[build-system]
requires = ["meson-python>=0.18", "meson>=1.3", "ninja", "numpy>=2.0,<3"]
build-backend = "mesonpy"

[project]
name = "PyCOMPLETE-PyPIC"
version = "2.4.6"
description = "CPU particle-in-cell solvers for PyCOMPLETE"
readme = "README.md"
license-files = ["COPYING"]
requires-python = ">=3.10"
dependencies = ['numpy>=2.0,<3', 'scipy>=1.13', 'matplotlib>=3.9']

[project.optional-dependencies]
klu = ["PyKLU>=0.2.0"]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/PyCOMPLETE/PyPIC"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win*"
test-requires = ["pytest>=8", "PyKLU>=0.2.0"]
test-command = "python {project}/tools/test_installed.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y gcc-gfortran"

[tool.cibuildwheel.macos]
before-all = "brew install gcc"
